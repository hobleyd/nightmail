name: nightmail-release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate code for enough_mail sub-package
        working-directory: packages/enough_mail
        run: dart pub get && dart run build_runner build --delete-conflicting-outputs

      - run: flutter test

  prepare:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      # Both halves of the version come from pubspec.yaml, and the build number
      # is the one the in-app updater compares: desktop_updater decides "newer"
      # on the build number ALONE and never reaches the semver when both sides
      # have one, so this counter has to rise monotonically across the whole
      # published archive, forever. It used to be github.run_number, which is a
      # different sequence from pubspec's and so told every locally built app it
      # was permanently out of date. Bumping pubspec.yaml is now what publishes
      # an update on desktop, exactly as it already was on Android.
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION_FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION="${VERSION_FULL%%+*}"
          BUILD_NUMBER="${VERSION_FULL##*+}"
          # A missing or non-numeric +BUILD would publish build 0, which every
          # existing install compares as older than what it already has — a
          # release nobody is ever offered. Fail rather than publish that.
          case "$VERSION_FULL" in
            *+*) ;;
            *) echo "pubspec.yaml version '$VERSION_FULL' has no +BUILD suffix" >&2; exit 1 ;;
          esac
          case "$BUILD_NUMBER" in
            ''|*[!0-9]*) echo "pubspec.yaml build number '$BUILD_NUMBER' is not a number" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Releasing $VERSION+$BUILD_NUMBER"

      - name: Push version tag
        uses: EndBug/latest-tag@latest
        with:
          tag-name: ${{ steps.version.outputs.version }}

  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      # `if:` conditions cannot reference the secrets context directly, so
      # gate signing/notarization steps on this instead.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate code for enough_mail sub-package
        working-directory: packages/enough_mail
        run: dart pub get && dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      # Only a push to main (or a same-repo PR) carries these secrets; a
      # fork PR builds ad-hoc/unsigned exactly as before, so contributor CI
      # never fails for lacking a certificate it was never meant to have.
      - name: Import Developer ID signing certificate
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # keychain-access-groups requires an actual Developer ID profile --
          # Manual signing with none at all fails "requires a provisioning
          # profile" even though Developer ID never uses one for anything
          # else. Xcode reads profiles by content, not filename, but names
          # them by UUID by convention.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/Nightmail.provisionprofile"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/Nightmail.provisionprofile" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/Nightmail.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.provisionprofile"

          # Patch the checked-out (not committed) pbxproj so Release actually
          # signs with the Developer ID identity just imported. Left alone,
          # Release stays CODE_SIGN_STYLE=Automatic with no DEVELOPMENT_TEAM,
          # i.e. ad-hoc -- exactly what an unsigned/fork run should still get.
          python3 - <<'EOF'
          import pathlib
          path = pathlib.Path("macos/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          anchor = "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n\t\t\t\tCODE_SIGN_STYLE = Automatic;\n"
          assert text.count(anchor) == 1, "Release Runner build-settings anchor not found or not unique -- pbxproj layout changed, update this patch"
          replacement = (
              "\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Release.entitlements;\n"
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Developer ID Application\";\n"
              "\t\t\t\tCODE_SIGN_INJECT_BASE_ENTITLEMENTS = NO;\n"
              "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
              "\t\t\t\tDEVELOPMENT_TEAM = 69XRMYD9XG;\n"
              "\t\t\t\tENABLE_HARDENED_RUNTIME = YES;\n"
              "\t\t\t\tOTHER_CODE_SIGN_FLAGS = \"--timestamp\";\n"
          )
          text = text.replace(anchor, replacement)

          # An empty PROVISIONING_PROFILE_SPECIFIER is fine for ad-hoc, but
          # Manual signing with keychain-access-groups needs the real one.
          old_tail = "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";\n\t\t\t\tSWIFT_VERSION = 5.0;\n\t\t\t};\n\t\t\tname = Release;\n\t\t};\n"
          assert text.count(old_tail) == 1, "Release Runner tail anchor not found or not unique"
          new_tail = "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = Nightmail;\n\t\t\t\tSWIFT_VERSION = 5.0;\n\t\t\t};\n\t\t\tname = Release;\n\t\t};\n"
          text = text.replace(old_tail, new_tail)

          # TargetAttributes.ProvisioningStyle is a separate, higher-precedence
          # setting Xcode's own UI maintains; per-config CODE_SIGN_STYLE alone
          # doesn't override it, so it has to move to Manual too.
          old_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Automatic;\n"
          assert text.count(old_attr) == 1, "ProvisioningStyle anchor not found or not unique"
          new_attr = "\t\t\t\t\t\tCreatedOnToolsVersion = 9.2;\n\t\t\t\t\t\tLastSwiftMigration = 1100;\n\t\t\t\t\t\tProvisioningStyle = Manual;\n"
          text = text.replace(old_attr, new_attr)

          path.write_text(text)
          EOF

      - run: flutter build macos --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}

      # The in-app updater refuses a staged app if *any* entry in it is
      # group- or other-writable. desktop_updater's helper hashes the staged
      # bundle through macStageMode, which requires `mode & 0o022 == 0` on
      # every file and directory, and throws stageAuthenticationFailed on the
      # first one that is not -- reported to the user as the single sentence
      # "Unable to confirm update installation handoff", with no indication of
      # which file or even which check.
      #
      # Flutter ships MaterialIcons-Regular.otf at 0664 in its own SDK cache
      # (bin/cache/artifacts/material_fonts/) and copies it into
      # flutter_assets with the mode intact, so every macOS build carried one
      # group-writable file and no in-app update could ever install. It was
      # invisible from the installed app, because Finder normalises permissions
      # when it copies from a DMG -- the installed copy reads 0644 and only the
      # zip the updater downloads preserves 0664. That is exactly backwards
      # from where anyone would look.
      #
      # This runs after signing deliberately: permission bits are not part of
      # what codesign seals, so the signature, the designated requirement and
      # the stapled ticket all still validate afterwards (checked).
      - name: Normalise bundle permissions for the updater
        run: |
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          chmod -R go-w "$APP_PATH"
          find "$APP_PATH" -type d -exec chmod a+rx {} +
          find "$APP_PATH" -type f -exec chmod a+r {} +
          # Assert rather than trust: this is the whole of macStageMode, and a
          # future dependency that ships an odd mode must fail here, where the
          # file is named, rather than on a user's machine where it is not.
          python3 - "$APP_PATH" <<'PY'
          import os, stat as st, sys
          root = sys.argv[1]
          bad = []
          def check(path):
              s = os.lstat(path)
              if st.S_ISLNK(s.st_mode):
                  return
              mode = s.st_mode & 0o7777
              why = []
              if getattr(s, "st_flags", 0): why.append("st_flags set")
              if mode & 0o7000: why.append("setuid/setgid/sticky")
              if mode & 0o022: why.append("group/other writable")
              if st.S_ISDIR(s.st_mode):
                  if mode & 0o005 != 0o005: why.append("dir not other r-x")
              elif st.S_ISREG(s.st_mode):
                  if mode & 0o004 != 0o004: why.append("not other-readable")
                  if not (mode & 0o111 == 0 or mode & 0o101 == 0o101):
                      why.append("odd exec bits")
              else:
                  why.append("not a file, directory or symlink")
              if why:
                  bad.append(f"{oct(mode)} {', '.join(why)}: {os.path.relpath(path, root)}")
          check(root)
          for base, dirs, files in os.walk(root):
              for name in dirs + files:
                  check(os.path.join(base, name))
          for line in bad:
              print(f"::error::staged-bundle permission rule violated: {line}")
          sys.exit(1 if bad else 0)
          PY

      - name: Notarize and staple
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/nightmail.app"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/nightmail-notarize.zip"
          # --wait exits 0 once Apple responds at all, Accepted or Invalid --
          # a rejection is not a CLI failure, so the status has to be checked
          # explicitly rather than relying on notarytool's own exit code.
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$RUNNER_TEMP/nightmail-notarize.zip" \
            --key "$RUNNER_TEMP/notary_key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ { print $2; exit }')
          if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization did not succeed -- fetching the detailed log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$RUNNER_TEMP/notary_key.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple "$APP_PATH"

      # create-dmg is called directly rather than through
      # lethja/create-dmg-action, which derives *three* things from its one
      # `name` input: the output file, `--volname`, and `--icon <name>.app` —
      # and that last one names the bundle **inside** the volume, which Finder
      # then has to find to position. So the version could not be added to the
      # file name without also claiming the app was called
      # `nightmail-1.26.1.app`, and AppleScript failed the build with
      # "Can't set item ... (-10006)".
      #
      # Versioning it matters because the DMG was the one release asset with no
      # version in it, while every other platform's has one —
      # `nightmail-<version>.exe`, `nightmail_<version>_amd64.snap`,
      # `nightmail-<version>-release.apk`. A downloads folder holding three
      # `nightmail.dmg`s, and a Finder window that cannot tell you which one is
      # open, is how the wrong build gets installed and then reported as a bug.
      # Driving create-dmg ourselves lets the file name match the other assets
      # and the volume read as a name ("NightMail 1.26.1") independently.
      #
      # The bundle name is **resolved from disk, not written down**. The real
      # directory is `NightMail.app` (CFBundleName, case-preserved by APFS),
      # not the lowercase path this workflow addresses it by — the old
      # `--icon nightmail.app` only ever matched because Finder compares names
      # case-insensitively. Same trap as the `--app-name` the packaging step
      # below documents.
      #
      # The background is `macos/dmg/background.png`, drawn from the logo's own
      # night sky by `tool/dmg_background.swift` — which carries the same window
      # and icon geometry as the flags below, and has to be re-run if either
      # moves. It replaces the anonymous gradient the action used to generate on
      # the fly.
      - name: Create DMG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APP_DIR="build/macos/Build/Products/Release"
          APP_BUNDLE_NAME=$(basename "$(ls -d "$APP_DIR"/*.app | head -1)")
          if [ -z "$APP_BUNDLE_NAME" ]; then
            echo "::error::no .app in $APP_DIR to build a DMG from" >&2
            exit 1
          fi
          echo "Packaging $APP_BUNDLE_NAME as nightmail-$VERSION.dmg"
          brew install create-dmg
          create-dmg \
            --volname "NightMail $VERSION" \
            --background macos/dmg/background.png \
            --window-pos 200 120 \
            --window-size 800 450 \
            --icon-size 100 \
            --icon "$APP_BUNDLE_NAME" 200 185 \
            --app-drop-link 600 185 \
            "nightmail-$VERSION.dmg" \
            "$APP_DIR/$APP_BUNDLE_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'nightmail-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'nightmail-${{ needs.prepare.outputs.version }}.dmg'

      # In-app updates: the .app is zipped and described by a release.json that
      # the app verifies against the pinned public key before installing.
      # --artifact-url must be where the deploy job below actually publishes it.
      #
      # --app-name must be the .app bundle's real on-disk name, because
      # desktop_updater's client stages the extracted zip at
      # <staging>/<descriptor.appName> (update_client.dart) -- it doesn't
      # look inside the archive for the app, it trusts this field. ditto
      # --keepParent writes the archive's top-level entry as whatever name
      # the bundle actually has on the case-preserving APFS runner, which is
      # "NightMail.app" (matching CFBundleName), not the lowercase path this
      # workflow addresses it by. Passing "nightmail" here (no ".app", wrong
      # case) made every install look for a directory that was never in the
      # zip: "FormatException: Staged macOS app must be a directory: .../nightmail".
      # The actual zip filename the packager writes is derived from
      # --app-name too (its ".app"/".exe" suffix stripped, case otherwise
      # kept -- see ZipReleasePackager._artifactNameStem), so --artifact-url
      # has to be built from the same APP_BUNDLE_NAME, not a separately
      # hand-picked lowercase name, or it points at a file that was never
      # written.
      - name: Package release for desktop_updater
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          APP_BUNDLE_NAME="NightMail.app"
          ARTIFACT_STEM="${APP_BUNDLE_NAME%.app}"
          dart run desktop_updater:package \
            --input "build/macos/Build/Products/Release/nightmail.app" \
            --output "dist/${VERSION}+${BUILD_NUMBER}-macos" \
            --package-id au.com.sharpblue.nightmail \
            --app-name "$APP_BUNDLE_NAME" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform macos \
            --channel stable \
            --artifact-url "https://hobleyd.github.io/nightmail/releases/${VERSION}+${BUILD_NUMBER}-macos/${ARTIFACT_STEM}-${VERSION}-macos.zip" \
            --install-strategy wholeBundleReplace

      - name: Import release signing key
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign release descriptor
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          dart run desktop_updater:release sign \
            --release "dist/${VERSION}+${BUILD_NUMBER}-macos/release.json" \
            --key-profile desktop_updater.keys.json

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

      - name: Remove signing keychain
        if: ${{ always() && env.HAS_SIGNING_CERT == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: choco install innosetup --no-progress -y
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate code for enough_mail sub-package
        working-directory: packages/enough_mail
        run: dart pub get && dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}
      - run: dart run windows.dart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'nightmail-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'build/windows/nightmail-${{ needs.prepare.outputs.version }}.exe'

      # The in-app updater replaces the unpacked runner directory, not the Inno
      # installer above — the .exe stays the download for a fresh install.
      - name: Package release for desktop_updater
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          APP_NAME="nightmail"
          dart run desktop_updater:package \
            --input "build/windows/x64/runner/Release" \
            --output "dist/${VERSION}+${BUILD_NUMBER}-windows" \
            --package-id au.com.sharpblue.nightmail \
            --app-name "$APP_NAME" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --platform windows \
            --channel stable \
            --artifact-url "https://hobleyd.github.io/nightmail/releases/${VERSION}+${BUILD_NUMBER}-windows/${APP_NAME}-${VERSION}-windows.zip" \
            --install-strategy wholeDirectoryReplace

      - name: Import release signing key
        shell: bash
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign release descriptor
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          dart run desktop_updater:release sign \
            --release "dist/${VERSION}+${BUILD_NUMBER}-windows/release.json" \
            --key-profile desktop_updater.keys.json

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl git unzip xz-utils python3 jq \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev \
            libsecret-1-dev libjson-glib-dev libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev \
            binutils coreutils desktop-file-utils fakeroot patchelf util-linux imagemagick

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: flutter config --enable-linux-desktop
      - run: flutter create --platforms=linux .
      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate code for enough_mail sub-package
        working-directory: packages/enough_mail
        run: dart pub get && dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release --no-tree-shake-icons

      - name: Prepare bundle assets
        run: convert assets/logo.png -resize 512x512 build/linux/x64/release/bundle/nightmail.png

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build Snap package
        run: |
          sed -i "s/^version: .*/version: '${{ needs.prepare.outputs.version }}'/" snap/snapcraft.yaml
          snapcraft --destructive-mode

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'nightmail-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'nightmail_${{ needs.prepare.outputs.version }}_amd64.snap'

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: false

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate code for enough_mail sub-package
        working-directory: packages/enough_mail
        run: dart pub get && dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      - name: Create key.properties
        run: |
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storePassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.KEY_BASE_64 }}
        run: printf '%s' "$ENCODED_STRING" | base64 -di > android/app/keystore.jks

      - run: flutter build apk --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v0.1.15
        with:
          name: 'nightmail-${{ needs.prepare.outputs.version }}'
          tag_name: ${{ needs.prepare.outputs.version }}
          files: 'build/app/outputs/apk/release/nightmail-${{ needs.prepare.outputs.version }}-release.apk'
          generate_release_notes: true
  # Uploads to TestFlight only -- there is no GitHub Release asset for iOS,
  # since an .ipa can't be sideloaded the way the other platforms' artifacts
  # can. Distribution to testers is entirely an App Store Connect setting (an
  # External Testing group's public link, "automatically distribute new
  # builds" turned on); this job's only job is getting a signed build there.
  #
  # Push-only, like `prepare`: TestFlight permanently refuses a
  # (version, build) pair it has already seen, even after deletion, unlike
  # the other platforms here which just overwrite on a re-push. A push to
  # main that isn't a fresh pubspec version bump will fail this job loudly --
  # deliberately, for the same reason `prepare` fails loudly on a missing or
  # non-numeric +BUILD rather than silently publishing something wrong.
  build-ios:
    needs: prepare
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate code for enough_mail sub-package
        working-directory: packages/enough_mail
        run: dart pub get && dart run build_runner build --delete-conflicting-outputs
      - run: dart run flutter_launcher_icons

      # Mirrors build-macos's cert-import shape (create keychain -> import
      # .p12 -> place the profile by UUID), swapped for an Apple Distribution
      # cert and an App Store profile. Unlike the macOS job there is no
      # ad-hoc/unsigned fallback: an app-store-method archive cannot export
      # without real signing, and TestFlight is the whole point of this job.
      - name: Import distribution certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          echo "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/ios_cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/ios_cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/NightMail_App_Store.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/NightMail_App_Store.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/NightMail_App_Store.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - run: flutter build ipa --release --no-tree-shake-icons --build-number ${{ needs.prepare.outputs.build_number }} --export-options-plist=ios/ExportOptions.plist

      # altool reads the API key from this fixed path by Key ID -- there is
      # no flag for it. `--upload-app` maps the .ipa's bundle ID onto an
      # existing App Store Connect app record; it does not create one.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.ASC_KEY_P8 }}" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true

  # Publishes everything the in-app updater reads: the signed app-archive index,
  # each platform's signed release descriptor and zip, and the release notes the
  # About panel shows. Android is not here — it installs its APK straight from
  # the GitHub release — but it reads release-notes.json from this same site.
  deploy:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are derived from the commits since the previous
          # version tag, so the whole history and every tag has to be present.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - run: flutter pub get

      - name: Download macOS distribution
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-macos/

      - name: Download Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: deploy/releases/${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build_number }}-windows/

      - name: Generate release notes
        run: |
          dart run tool/release_notes.dart \
            --version "${{ needs.prepare.outputs.version }}" \
            --output deploy/release-notes.json
          cat deploy/release-notes.json

      - name: Update app-archive.json
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          APP_NAME="nightmail"

          git fetch origin gh-pages 2>/dev/null || true
          if git show origin/gh-pages:app-archive.json > deploy/app-archive.json 2>/dev/null \
              && jq -e '.schemaVersion == 3' deploy/app-archive.json > /dev/null 2>&1; then
            echo "Using existing schema v3 app-archive.json from gh-pages"
            # The published archive is signed from the previous run; upsert
            # refuses to touch a signed archive, and the whole thing is re-signed
            # below anyway.
            jq 'del(.signature)' deploy/app-archive.json > deploy/app-archive.json.tmp
            mv deploy/app-archive.json.tmp deploy/app-archive.json
          else
            rm -f deploy/app-archive.json
            echo "No compatible existing app-archive.json found; starting a new schema v3 index"
          fi

          for PLATFORM in macos windows; do
            dart run desktop_updater:app_archive upsert \
              --archive deploy/app-archive.json \
              --app-name "$APP_NAME" \
              --version "$VERSION" \
              --build-number "$BUILD_NUMBER" \
              --platform "$PLATFORM" \
              --channel stable \
              --release-url "https://hobleyd.github.io/nightmail/releases/${VERSION}+${BUILD_NUMBER}-${PLATFORM}/release.json"
          done

      - name: Import release signing key
        env:
          DESKTOP_UPDATER_KEY_PASSPHRASE: ${{ secrets.DESKTOP_UPDATER_KEY_PASSPHRASE }}
        run: |
          echo "${{ secrets.DESKTOP_UPDATER_KEY_BUNDLE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.dukey"
          dart run desktop_updater:release keys import \
            --input "$RUNNER_TEMP/release-key.dukey" \
            --passphrase-env DESKTOP_UPDATER_KEY_PASSPHRASE

      - name: Sign app-archive.json
        run: |
          dart run desktop_updater:release sign \
            --app-archive deploy/app-archive.json \
            --key-profile desktop_updater.keys.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          # Past releases must survive: an app still on an old version fetches
          # its descriptor from the URL the archive recorded at the time.
          keep_files: true
