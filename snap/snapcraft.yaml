name: nightmail
base: core24
version: 'dev'
title: NightMail
summary: A cross-platform email client for Microsoft 365, Gmail, and IMAP/SMTP
description: |
  NightMail supports Microsoft 365, Google Workspace, Gmail, and standard
  IMAP/SMTP accounts from a single unified interface. Provides a three-pane
  layout with integrated calendar, tasks, and contacts across all providers.
contact: https://github.com/hobleyd/nightmail/issues
website: https://github.com/hobleyd/nightmail
grade: stable
confinement: classic

apps:
  nightmail:
    command: nightmail
    # A path under the prime directory, supplied by the desktop-entry part
    # below. snapcraft 9.0 resolved this key against prime/ after copying
    # snap/gui/ into prime/meta/gui/, so `meta/gui/nightmail.desktop` worked;
    # 9.1 renders app desktop files in the same pass as that copy and falls
    # back to the project's snap/ directory, so the same value became
    # `snap/meta/gui/nightmail.desktop` and the Linux release job failed with
    # "Failed to generate desktop file ... file does not exist". Only a file
    # that a part actually primes resolves the same way in both.
    desktop: usr/share/applications/nightmail.desktop

parts:
  nightmail:
    plugin: dump
    source: build/linux/x64/release/bundle
    build-packages:
      - patchelf
    override-prime: |
      craftctl default
      patchelf --set-rpath '$ORIGIN/lib' "$CRAFT_PRIME/nightmail"
      find "$CRAFT_PRIME/lib" -name "*.so*" -type f | while read lib; do
        patchelf --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
      done
  # Primes the desktop entry where `apps.nightmail.desktop` points. Only the
  # .desktop is staged: snap/gui/nightmail.png would otherwise collide with the
  # nightmail.png the release workflow writes into the Flutter bundle.
  #
  # That bundle copy is what the entry's `Icon=${SNAP}/nightmail.png` names,
  # and the extension is load-bearing: snapcraft rewrites `Icon=` to
  # `${SNAP}/<value>` whenever <value> is a file in prime/, and a bare
  # `Icon=nightmail` matched the *executable* of the same name — so the
  # launcher was handed an ELF binary and drew a black square.
  desktop-entry:
    plugin: dump
    source: snap/gui
    organize:
      nightmail.desktop: usr/share/applications/nightmail.desktop
    stage:
      - usr/share/applications/nightmail.desktop
